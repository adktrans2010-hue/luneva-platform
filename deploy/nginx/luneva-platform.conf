server {
    listen 80;
    listen [::]:80;
    server_name luneva-psy.ru www.luneva-psy.ru 217.12.38.173;

    return 301 https://luneva-psy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name luneva-psy.ru www.luneva-psy.ru 217.12.38.173;

    ssl_certificate /etc/letsencrypt/live/luneva-psy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luneva-psy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match "luneva-cache-bust";
        proxy_set_header If-Modified-Since "Thu, 01 Jan 1970 00:00:00 GMT";
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location ~* \.(?:avif|webp|jpe?g|png|gif|svg|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match "luneva-cache-bust";
        proxy_set_header If-Modified-Since "Thu, 01 Jan 1970 00:00:00 GMT";
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_set_header If-None-Match "luneva-cache-bust";
        proxy_set_header If-Modified-Since "Thu, 01 Jan 1970 00:00:00 GMT";
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }
}
